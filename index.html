<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Year 8 Maths</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f5f6f0;
    --paper-line:#d9dccf;
    --ink:#1f2a3c;
    --ink-soft:#4d5b73;
    --coral:#e0533e;
    --gold:#c98f2b;
    --teal:#2f6f6a;
    --card:#ffffff;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(0deg, var(--paper-line) 0px, var(--paper-line) 1px, transparent 1px, transparent 28px),
      repeating-linear-gradient(90deg, var(--paper-line) 0px, var(--paper-line) 1px, transparent 1px, transparent 28px),
      var(--paper);
    background-size: 28px 28px, 28px 28px, auto;
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:860px; margin:0 auto; padding:28px 20px 80px;}

  header.top{margin-bottom:22px;}
  .kicker{
    font-family:'Space Grotesk', sans-serif;
    font-size:13px;
    letter-spacing:0.02em;
    color:var(--teal);
    margin:0 0 6px;
  }
  h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:clamp(34px, 8vw, 52px);
    line-height:0.98;
    margin:0 0 10px;
    color:var(--ink);
  }
  h1 span{color:var(--coral);}
  .sub{
    font-size:16px;
    color:var(--ink-soft);
    max-width:480px;
    line-height:1.5;
    margin:0;
  }

  nav.tabs{
    display:flex;
    gap:6px;
    margin:26px 0 22px;
    border-bottom:2px solid var(--ink);
    padding-bottom:0;
  }
  nav.tabs button{
    font-family:'Space Grotesk', sans-serif;
    font-size:15px;
    font-weight:600;
    background:none;
    border:none;
    color:var(--ink-soft);
    padding:10px 4px;
    margin-right:22px;
    cursor:pointer;
    position:relative;
    top:2px;
  }
  nav.tabs button.active{color:var(--ink);}
  nav.tabs button.active::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:-2px;
    height:3px;
    background:var(--coral);
  }
  nav.tabs button:focus-visible{outline:2px solid var(--teal); outline-offset:2px;}

  section.view{display:none;}
  section.view.active{display:block;}

  /* Explore tab */
  .topic{
    background:var(--card);
    border:1px solid #d7d9cf;
    border-radius:var(--radius);
    margin-bottom:10px;
    overflow:hidden;
  }
  .topic-head{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 16px;
    cursor:pointer;
    user-select:none;
  }
  .topic-num{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:15px;
    width:28px; height:28px;
    border-radius:50%;
    border:1.5px solid var(--ink);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .topic-title{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:17px;
    flex:1;
  }
  .topic-strand{font-size:13px; color:var(--ink-soft); font-weight:400; display:block; margin-top:2px; font-family:'IBM Plex Sans',sans-serif;}
  .chevron{font-size:18px; color:var(--ink-soft); transition:transform .18s ease; flex-shrink:0;}
  .topic.open .chevron{transform:rotate(180deg);}
  .topic-body{
    max-height:0;
    overflow:hidden;
    transition:max-height .22s ease;
    border-top:1px solid transparent;
  }
  .topic.open .topic-body{border-top:1px solid #e5e6dd;}
  .topic-body-inner{padding:14px 16px 18px 16px;}
  .block{margin-bottom:12px;}
  .block:last-child{margin-bottom:0;}
  .block-label{
    font-family:'Space Grotesk', sans-serif;
    font-size:12px;
    font-weight:600;
    color:var(--teal);
    margin:0 0 4px;
  }
  .block p{margin:0; font-size:14.5px; line-height:1.55; color:var(--ink);}
  .tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:4px;}
  .tags span{
    font-size:12px;
    background:#eef1e8;
    border:1px solid #d7d9cf;
    padding:3px 9px;
    border-radius:20px;
    color:var(--ink-soft);
  }

  /* Practice tab */
  .chip-row{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:22px;}
  .chip{
    font-family:'Space Grotesk', sans-serif;
    font-size:13.5px;
    font-weight:600;
    background:var(--card);
    border:1.5px solid var(--ink);
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
  }
  .chip.done{background:#eaf3ee; border-color:var(--teal); color:var(--teal);}
  .chip.active{background:var(--ink); color:var(--paper);}

  #quizArea{background:var(--card); border:1px solid #d7d9cf; border-radius:var(--radius); padding:20px;}
  .quiz-empty{color:var(--ink-soft); font-size:14.5px;}
  .q{margin-bottom:22px;}
  .q:last-of-type{margin-bottom:8px;}
  .q-text{font-size:15.5px; font-weight:500; margin:0 0 10px; line-height:1.45;}
  .opt{
    display:flex; align-items:center; gap:10px;
    padding:9px 12px;
    border:1.5px solid #d7d9cf;
    border-radius:8px;
    margin-bottom:7px;
    cursor:pointer;
    font-size:14.5px;
  }
  .opt:hover{border-color:var(--ink-soft);}
  .opt.selected{border-color:var(--ink); background:#f0f1ea;}
  .opt.correct{border-color:var(--teal); background:#e6f2ee;}
  .opt.wrong{border-color:var(--coral); background:#fbeae7;}
  .opt input{accent-color:var(--ink);}
  .btn{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:14.5px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    padding:11px 20px;
    border-radius:8px;
    cursor:pointer;
  }
  .btn:disabled{opacity:0.4; cursor:default;}
  .btn.ghost{background:none; color:var(--ink); border:1.5px solid var(--ink);}
  .result-banner{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:16px;
    padding:12px 14px;
    border-radius:8px;
    margin-bottom:16px;
    background:#eef1e8;
  }

  /* Progress tab */
  .prog-row{display:flex; align-items:center; gap:12px; margin-bottom:14px;}
  .prog-label{width:210px; font-size:13.5px; flex-shrink:0;}
  .prog-label b{display:block; font-family:'Space Grotesk',sans-serif; font-size:14px;}
  .prog-track{flex:1; height:14px; background:#e5e6dd; border-radius:8px; overflow:hidden;}
  .prog-fill{height:100%; background:var(--gold); border-radius:8px; transition:width .3s ease;}
  .prog-fill.zero{background:transparent;}
  .prog-pct{width:42px; text-align:right; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13.5px; flex-shrink:0;}
  .overall{
    background:var(--card); border:1px solid #d7d9cf; border-radius:var(--radius);
    padding:18px 20px; margin-bottom:24px;
  }
  .overall .big{font-family:'Space Grotesk',sans-serif; font-size:38px; font-weight:700;}
  .overall .cap{font-size:13.5px; color:var(--ink-soft);}
  .reset-link{font-size:12.5px; color:var(--ink-soft); background:none; border:none; text-decoration:underline; cursor:pointer; padding:0; margin-top:18px;}

  @media (max-width:480px){
    .prog-label{width:120px; font-size:12.5px;}
  }

  /* ---- login + teacher dashboard ---- */
  [hidden]{display:none !important;}
  .auth-card{
    background:var(--card); border:1px solid #d7d9cf; border-radius:var(--radius);
    padding:22px 22px 24px; max-width:420px; margin-top:8px;
  }
  .seg{display:flex; border:1.5px solid var(--ink); border-radius:8px; overflow:hidden; margin-bottom:18px;}
  .seg button{
    flex:1; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14px;
    background:none; border:none; padding:10px; cursor:pointer; color:var(--ink);
  }
  .seg button.active{background:var(--ink); color:var(--paper);}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:13px; font-weight:500; margin-bottom:5px; color:var(--ink-soft);}
  .field input{
    width:100%; font-family:'IBM Plex Sans',sans-serif; font-size:15px;
    padding:10px 12px; border:1.5px solid #c9ccbf; border-radius:8px; background:#fff; color:var(--ink);
  }
  .field input:focus{outline:2px solid var(--teal); outline-offset:1px; border-color:var(--teal);}
  .msg{font-size:13.5px; margin:0 0 14px; padding:9px 12px; border-radius:8px; line-height:1.45;}
  .msg.err{background:#fbeae7; color:#8c2a1b;}
  .msg.ok{background:#e6f2ee; color:#1f5550;}
  .userbar{
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    font-size:13.5px; color:var(--ink-soft); margin:-6px 0 4px;
  }
  .userbar b{color:var(--ink); font-family:'Space Grotesk',sans-serif;}
  .linkbtn{
    font-family:'IBM Plex Sans',sans-serif; font-size:13px; background:none; border:none;
    color:var(--ink-soft); text-decoration:underline; cursor:pointer; padding:0;
  }
  .save-note{font-size:12.5px; color:var(--ink-soft); margin-top:6px; font-weight:400;}
  .table-wrap{overflow-x:auto; background:var(--card); border:1px solid #d7d9cf; border-radius:var(--radius);}
  table.grid{border-collapse:collapse; width:100%; min-width:640px; font-size:13.5px;}
  table.grid th, table.grid td{padding:9px 8px; text-align:center; border-bottom:1px solid #e5e6dd;}
  table.grid th{font-family:'Space Grotesk',sans-serif; font-size:12.5px; color:var(--ink-soft); font-weight:600;}
  table.grid th:first-child, table.grid td:first-child{text-align:left; padding-left:14px; white-space:nowrap; font-weight:500;}
  .cell-hi{background:#e6f2ee; color:#1f5550; font-weight:600;}
  .cell-mid{background:#f7edd6; color:#7a5412; font-weight:600;}
  .cell-lo{background:#fbeae7; color:#8c2a1b; font-weight:600;}
  .cell-none{color:#a5a99b;}
  .key{font-size:12.5px; color:var(--ink-soft); line-height:1.6; margin-top:14px;}
  .dash-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; gap:10px;}
  .dash-head p{margin:0; font-size:14px; color:var(--ink-soft);}
  .loading{color:var(--ink-soft); font-size:14.5px;}
</style>
</head>
<body>

<div class="wrap">

  <header class="top">
    <p class="kicker">KS3 MATHEMATICS</p>
    <h1>Year 8<span>.</span></h1>
    <p class="sub">Nine topics, one year. Explore what each one covers and practise with quick quizzes.</p>
  </header>

  <p class="loading" id="loadingView">Loading…</p>

  <section id="authView" hidden>
    <div class="auth-card">
      <div class="seg">
        <button id="modeIn" class="active" type="button">Sign in</button>
        <button id="modeUp" type="button">Create account</button>
      </div>
      <div id="authMsg"></div>
      <div class="field" id="nameField" hidden>
        <label for="nameInput">Your name</label>
        <input id="nameInput" type="text" autocomplete="name" placeholder="e.g. Sam Patel">
      </div>
      <div class="field">
        <label for="emailInput">Email</label>
        <input id="emailInput" type="email" autocomplete="email">
      </div>
      <div class="field">
        <label for="passInput">Password</label>
        <input id="passInput" type="password" autocomplete="current-password" placeholder="At least 6 characters">
      </div>
      <button class="btn" id="authBtn" type="button">Sign in</button>
    </div>
  </section>

  <div id="appView" hidden>
    <div class="userbar">
      <span>Signed in as <b id="whoami"></b></span>
      <button class="linkbtn" id="signOutBtn" type="button">Sign out</button>
    </div>

    <nav class="tabs">
      <button data-view="explore" class="active">Explore</button>
      <button data-view="practice">Practice</button>
      <button data-view="dashboard" id="dashTab" hidden>Class progress</button>
    </nav>

    <section id="explore" class="view active"></section>
    <section id="practice" class="view">
      <div class="chip-row" id="chipRow"></div>
      <div id="quizArea"><p class="quiz-empty">Pick a topic above to start a practice quiz.</p></div>
    </section>
    <section id="dashboard" class="view"></section>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script>
const TOPICS = [
  {
    id:1, title:"Proportional Reasoning", strand:"Ratio and Proportion",
    knowledge:"Understanding and comparing ratio, using ratio notation, solving ratio problems, scale factors, maps, direct proportion.",
    skills:"Problem solving. Applying knowledge. Fluency. Using maths to justify.",
    bigidea:"Ratio and scale. Multiplicative change.",
    cross:["Geography","Science","DT","RS","Food tech"],
    quiz:[
      {q:"Simplify the ratio 8a : 10a.", opts:["4:5", "8:10", "2:5", "4:10"], a:0},
      {q:"Write the ratio 18:30 in its simplest form.", opts:["3:5", "5:3", "9:15", "2:3"], a:0},
      {q:"Write the ratio 4:6 in the form 1 : n.", opts:["1 : 1.5", "1 : 2", "1 : 0.5", "1 : 4"], a:0},
      {q:"Write the ratio 5:2 in the form n : 1.", opts:["2.5 : 1", "5 : 1", "0.4 : 1", "2 : 5"], a:0},
      {q:"Write the ratio 5:8 in the form 1 : n.", opts:["1 : 3", "1 : 1.6", "1 : 0.625", "1 : 8"], a:1},
      {q:"Asha types 720 words in 16 minutes, Ben types 828 words in 18 minutes, and Cai types 798 words in 19 minutes. Who types fastest?", opts:["Asha", "Ben", "Cai", "They are all the same speed"], a:1},
      {q:"Share 1421 in the ratio 5:2. What is the larger share?", opts:["406", "609", "1015", "203"], a:2},
      {q:"If x:y = 11:8 and y:z = 6:7, what is x:z?", opts:["33:28", "11:7", "66:48", "33:24"], a:0},
      {q:"If a:b = 2:3 and b:c = 4:5, what is a:b:c?", opts:["2:3:5", "8:12:15", "8:6:15", "6:12:20"], a:1},
      {q:"Two numbers are in the ratio 7:9. The difference between them is 150. What is the larger number?", opts:["525", "600", "675", "750"], a:2},
      {q:"Three numbers are in the ratio 2:3:7 and their mean is 48. What is the largest number?", opts:["36", "72", "84", "96"], a:2},
      {q:"Three numbers are in the ratio 2:3:7 and their mean is 48. What is the median of the three numbers?", opts:["24", "36", "48", "84"], a:1},
      {q:"A bar model shows a with 4 boxes and b with 2 boxes. What is a:b in its simplest form?", opts:["4:2", "2:1", "1:2", "6:1"], a:1},
      {q:"5 notebooks cost £4.20. Using the unitary method, how much do 8 notebooks cost?", opts:["£6.72", "£6.30", "£7.20", "£5.88"], a:0},
      {q:"Which description matches two quantities in direct proportion?", opts:["As one increases, the other increases at a constant rate", "As one increases, the other decreases", "Their graph is a curve that never touches the axes", "They always add up to the same total"], a:0},
      {q:"As one quantity goes up, the other goes down in a matching way. This is called...", opts:["Direct proportion", "Inverse proportion", "Equal proportion", "Random change"], a:1},
      {q:"All direct proportion graphs go through which point?", opts:["The origin (0, 0)", "(1, 1)", "(0, 5)", "(1, 0)"], a:0},
      {q:"Which is an example of direct proportion?", opts:["The total cost and the number of chocolate bars bought", "The speed and time to travel a fixed distance", "A person's age and their height", "The number of painters and the time to paint a wall"], a:0},
      {q:"A recipe for 4 people uses 400 g of pasta. How much pasta is needed for 6 people?", opts:["500 g", "600 g", "800 g", "1.2 kg"], a:1},
      {q:"A recipe for 4 people uses 2 shallots. How many shallots are needed for 10 people?", opts:["4", "5", "6", "8"], a:1},
      {q:"A muffin recipe for 20 muffins uses 250 g of sugar. How much sugar is needed for 8 muffins?", opts:["80 g", "100 g", "125 g", "160 g"], a:1},
      {q:"The cost C in pounds of p pencils is C = 1.5p. What is the cost of 10 pencils?", opts:["£1.50", "£11.50", "£15", "£150"], a:2},
      {q:"The cost C in pounds of p pencils is C = 1.5p. How many pencils can you buy for £9?", opts:["4", "6", "7.5", "13.5"], a:1},
      {q:"£1 = €1.20. How many euros do you get for £50?", opts:["€48", "€55", "€60", "€65"], a:2},
      {q:"When a shape is enlarged, which of these stays the same?", opts:["The side lengths", "The angles", "The area", "The perimeter"], a:1},
      {q:"A shape is enlarged by scale factor 3. A side of 4 cm becomes...", opts:["7 cm", "12 cm", "16 cm", "1.3 cm"], a:1},
      {q:"An enlargement with a scale factor between 0 and 1 makes the shape...", opts:["Larger", "Smaller", "The same size", "Upside down"], a:1},
      {q:"The lengths of a shape are enlarged by scale factor 3. By what factor does the area increase?", opts:["3", "6", "9", "27"], a:2},
      {q:"A square has area 16 cm². Its lengths are enlarged by scale factor 2. What is the new area?", opts:["32 cm²", "48 cm²", "64 cm²", "256 cm²"], a:2},
      {q:"x is the width of a square and y is its perimeter. How are x and y related?", opts:["Directly proportional (y = 4x)", "Inversely proportional", "Not related", "y = x²"], a:0}
    ]
  },
  {
    id:2, title:"Reasoning with Data", strand:"Data Handling",
    knowledge:"The data handling cycle, interpreting statistical diagrams, pie charts, averages, comparing distributions, scatter diagrams and correlation, two-way tables, listing outcomes, sample space diagrams.",
    skills:"Mathematical thinking. Using different representations and structures. Collaborative working. Oracy and presentation skills.",
    bigidea:"The data handling cycle. Measures of location.",
    cross:["History — scales, proportion & statistics","MFL — interpreting data"],
    quiz:[
      {q:"In a survey of 36 people, 9 chose football. What angle represents football on a pie chart?", opts:["36°", "90°", "9°", "45°"], a:1},
      {q:"On a pie chart, a sector of 72° represents 20 people. How many people were surveyed in total?", opts:["72", "90", "100", "120"], a:2},
      {q:"In a holiday survey of 180 people, the Europe sector is 124°. How many people chose Europe?", opts:["31", "62", "124", "72"], a:1},
      {q:"A pie chart has angles UK 88°, USA 32°, Other 44° and Nowhere 72°. What is the angle for Europe?", opts:["124°", "136°", "116°", "144°"], a:0},
      {q:"Which of these is qualitative data?", opts:["Favourite colour", "Height", "Time taken to run 100 m", "Temperature"], a:0},
      {q:"Which of these is discrete data?", opts:["Height", "Temperature", "Number of students in a class", "Time needed for a journey"], a:2},
      {q:"Which of these is continuous data?", opts:["Number of pets", "Score on a dice", "Height", "Number of siblings"], a:2},
      {q:"Class A has a mean mark of 62 and a range of 10. Class B has a mean of 62 and a range of 30. Which statement is correct?", opts:["Class A's marks are more consistent", "Class B's marks are more consistent", "Class B did better on average", "Class A did better on average"], a:0},
      {q:"Continuous data is usually found by...", opts:["Counting", "Measuring", "Listing", "Sorting"], a:1},
      {q:"A two-way table shows 19 boys walk, 23 boys take the bus and 40 boys cycle. How many boys are there in total?", opts:["62", "72", "82", "92"], a:2},
      {q:"60 students study a language. 24 are boys and 36 are girls. 15 study German, and 10 of those are girls. How many boys study German?", opts:["5", "10", "15", "25"], a:0},
      {q:"A student is picked at random from the 60 students (24 boys, 36 girls). What is P(girl)?", opts:["0.4", "0.5", "0.6", "0.36"], a:2},
      {q:"A two-way table shows 100 students: 33 walk and 49 come by car. The rest come by other means. How many is that?", opts:["18", "19", "22", "33"], a:0},
      {q:"As a car gets older, its value goes down. This shows...", opts:["Positive correlation", "Negative correlation", "No correlation", "Perfect correlation"], a:1},
      {q:"As height increases, shoe size tends to increase. This shows...", opts:["Positive correlation", "Negative correlation", "No correlation", "Causation"], a:0},
      {q:"A scatter graph has points spread randomly with no pattern. This shows...", opts:["Positive correlation", "Negative correlation", "No correlation", "Strong positive correlation"], a:2},
      {q:"Which is true about a line of best fit?", opts:["It is straight, with roughly equal numbers of points above and below", "It must go through the origin", "It must pass through every point", "It must be a curve"], a:0},
      {q:"Does a line of best fit have to go through the origin?", opts:["Yes, always", "No, it doesn't have to", "Only for positive correlation", "Only for negative correlation"], a:1},
      {q:"Estimating a value inside the range of the original data is called...", opts:["Extrapolation", "Interpolation", "Correlation", "Averaging"], a:1},
      {q:"Estimating a value outside the range of the original data is called...", opts:["Extrapolation", "Interpolation", "Correlation", "Averaging"], a:0},
      {q:"A scatter graph has data for cars aged 5 to 11 years. Which estimate is more reliable?", opts:["The value of an 8-year-old car", "The value of a 16-year-old car", "Both are equally reliable", "Neither can be estimated"], a:0},
      {q:"The data covers cars aged 5 to 11 years. Why is an estimate for a 16-year-old car less reliable?", opts:["It is outside the range of the data (extrapolation)", "Because 16 is an even number", "Because it is interpolation", "Because the line is always wrong"], a:0},
      {q:"A scatter graph shows ice cream sales and sunburn cases rising together. What can we say?", opts:["Ice cream causes sunburn", "There is correlation, but that does not prove one causes the other", "Sunburn causes ice cream sales", "There is no relationship"], a:1},
      {q:"What does 'no correlation' mean on a scatter graph?", opts:["The variables are definitely unrelated", "There is no linear relationship between them", "The data is wrong", "The line of best fit is flat"], a:1},
      {q:"An ice cream has 1 flavour (of 3) and 1 topping (of 4). How many different combinations are possible?", opts:["7", "12", "8", "16"], a:1},
      {q:"A meal deal has 4 sandwiches, 3 drinks and 2 snacks. How many different meal deals are possible?", opts:["9", "12", "24", "36"], a:2},

// ---------- Explore tab ----------
function buildExplore(){
  if(exploreBuilt) return;

    const div = document.createElement('div');

      : '';

        <div class="topic-num">${t.id}</div>

}

// ---------- Practice tab ----------
function renderChips(){
  const chipRow = $('chipRow');
  chipRow.innerHTML = '';
  TOPICS.forEach(t=>{
    const chip = document.createElement('button');
    chip.className = 'chip' + (t.id===activeTopicId ? ' active':'');
    chip.textContent = t.id + '. ' + t.title;
    chip.addEventListener('click', ()=>{ activeTopicId = t.id; renderChips(); renderQuiz(t); });
    chipRow.appendChild(chip);
  });
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function buildSet(topic, n){
  const picked = shuffle(topic.quiz).slice(0, Math.min(n, topic.quiz.length));
  return picked.map(q=>{
    const order = shuffle(q.opts.map((o,i)=>i));
    return { q:q.q, opts:order.map(i=>q.opts[i]), a:order.indexOf(q.a) };
  });
}

async function saveScore(topicId, pct){
  const note = $('saveNote');
  try{
    const { error } = await sb.from('scores').insert({ topic_id: topicId, pct: pct });
    if(note) note.textContent = error ? 'Your score could not be saved. Tell your teacher.' : 'Score saved.';
  }catch(e){
    if(note) note.textContent = 'Your score could not be saved. Tell your teacher.';
  }
}

function renderQuiz(topic){
  const quizArea = $('quizArea');
  let set = buildSet(topic, QUIZ_SIZE);
  let answers = new Array(set.length).fill(null);
  let submitted = false;

  function draw(){
    let html = '';
    set.forEach((q, qi)=>{
      html += `<div class="q" data-qi="${qi}"><p class="q-text">${qi+1}. ${q.q}</p>`;
      q.opts.forEach((opt, oi)=>{
        let cls = 'opt';
        if(submitted){
          if(oi === q.a) cls += ' correct';
          else if(answers[qi] === oi) cls += ' wrong';
        } else if(answers[qi] === oi){
          cls += ' selected';
        }
        html += `<label class="${cls}" data-qi="${qi}" data-oi="${oi}">
          <input type="radio" name="q${qi}" ${answers[qi]===oi?'checked':''} ${submitted?'disabled':''}/> ${opt}
        </label>`;
      });
      html += `</div>`;
    });

    if(submitted){
      const correctCount = set.filter((q,qi)=>answers[qi]===q.a).length;
      const pct = Math.round((correctCount/set.length)*100);
      html = `<div class="result-banner">${correctCount} / ${set.length} correct — ${pct}%<div class="save-note" id="saveNote">Saving…</div></div>` + html;
      html += `<button class="btn ghost" id="retryBtn">Try a new set</button>`;
    } else {
      html += `<button class="btn" id="submitBtn" ${answers.includes(null) ? 'disabled' : ''}>Submit answers</button>`;
    }

    quizArea.innerHTML = `<p class="quiz-empty" style="margin-bottom:14px;">Topic ${topic.id} · ${topic.title} · ${set.length} questions from a bank of ${topic.quiz.length}</p>` + html;

    if(!submitted){
      quizArea.querySelectorAll('.opt').forEach(el=>{
        el.addEventListener('click', ()=>{
          answers[+el.dataset.qi] = +el.dataset.oi;
          draw();
        });
      });
      const sbtn = $('submitBtn');
      if(sbtn) sbtn.addEventListener('click', ()=>{
        submitted = true;
        const correctCount = set.filter((q,qi)=>answers[qi]===q.a).length;
        const pct = Math.round((correctCount/set.length)*100);
        draw();
        saveScore(topic.id, pct);
      });
    } else {
      $('retryBtn').addEventListener('click', ()=>{
        set = buildSet(topic, QUIZ_SIZE);
        answers = new Array(set.length).fill(null);
        submitted = false;
        draw();
        window.scrollTo({top:0, behavior:'smooth'});
      });
    }
  }
  draw();
}

// ---------- Teacher dashboard ----------
async function fetchAll(table, columns){
  const rows = [];
  const page = 1000;
  for(let from=0; ; from+=page){
    const { data, error } = await sb.from(table).select(columns).range(from, from+page-1);
    if(error) throw error;
    rows.push(...data);
    if(data.length < page) break;
  }
  return rows;
}

async function renderDashboard(){
  const el = $('dashboard');
  el.innerHTML = '<p class="loading">Loading class progress…</p>';
  try{
    const [profiles, scores] = await Promise.all([
      fetchAll('profiles', 'id,display_name,role'),
      fetchAll('scores', 'user_id,topic_id,pct,created_at')
    ]);
    const students = profiles.filter(p => p.role === 'student')
      .sort((a,b)=> (a.display_name||'').localeCompare(b.display_name||''));
    const byUser = {};
    scores.forEach(s=>{
      const u = byUser[s.user_id] || (byUser[s.user_id] = { best:{}, attempts:0 });
      u.attempts++;
      if(!(s.topic_id in u.best) || s.pct > u.best[s.topic_id]) u.best[s.topic_id] = s.pct;
    });

    let head = '<tr><th>Student</th>' + TOPICS.map(t=>`<th title="${esc(t.title)}">${t.id}</th>`).join('') + '<th>Avg</th><th>Attempts</th></tr>';
    let rows = '';
    students.forEach(p=>{
      const u = byUser[p.id] || { best:{}, attempts:0 };
      const vals = TOPICS.map(t=>u.best[t.id]);
      const done = vals.filter(v=>v!==undefined);
      const avg = done.length ? Math.round(done.reduce((a,b)=>a+b,0)/done.length) : null;
      const cell = v => v===undefined ? '<td class="cell-none">–</td>'
        : `<td class="${v>=80?'cell-hi':v>=50?'cell-mid':'cell-lo'}">${v}%</td>`;
      rows += `<tr><td>${esc(p.display_name || 'Unnamed student')}</td>${vals.map(cell).join('')}`
            + (avg===null ? '<td class="cell-none">–</td>' : `<td>${avg}%</td>`)
            + `<td>${u.attempts}</td></tr>`;
    });
    if(!students.length) rows = '<tr><td colspan="12" class="cell-none" style="text-align:center;padding:20px;">No students have signed up yet.</td></tr>';

    el.innerHTML = `
      <div class="dash-head">
        <p>Best score per topic, for each student.</p>
        <button class="btn ghost" id="refreshDash" type="button">Refresh</button>
      </div>
      <div class="table-wrap"><table class="grid"><thead>${head}</thead><tbody>${rows}</tbody></table></div>
      <p class="key">${TOPICS.map(t=>`${t.id}. ${esc(t.title)}`).join(' &nbsp;·&nbsp; ')}</p>
      <p class="key">Green 80%+ &nbsp;·&nbsp; Amber 50–79% &nbsp;·&nbsp; Red under 50% &nbsp;·&nbsp; – not attempted</p>
    `;
    $('refreshDash').addEventListener('click', renderDashboard);
  }catch(e){
    el.innerHTML = '<div class="msg err">Could not load class progress. Check the database setup has been run.</div>';
  }
}

// ---------- Auth + session handling ----------
function showMsg(text, kind){
  $('authMsg').innerHTML = text ? `<div class="msg ${kind}">${esc(text)}</div>` : '';
}

function showAuth(){
  $('loadingView').hidden = true;
  $('appView').hidden = true;
  $('authView').hidden = false;
}

async function handleSession(session){
  if(!session){ showAuth(); return; }
  let role = 'student', name = '';
  try{
    const { data, error } = await sb.from('profiles').select('role,display_name').eq('id', session.user.id).maybeSingle();
    if(!error && data){ role = data.role; name = data.display_name || ''; }
  }catch(e){}
  isTeacher = role === 'teacher';
  $('whoami').textContent = (name || session.user.email) + (isTeacher ? ' (teacher)' : '');
  $('dashTab').hidden = !isTeacher;

  buildExplore();
  renderChips();

  // reset to Explore tab
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('section.view').forEach(s=>s.classList.remove('active'));
  document.querySelector('nav.tabs button[data-view="explore"]').classList.add('active');
  $('explore').classList.add('active');

  $('loadingView').hidden = true;
  $('authView').hidden = true;
  $('appView').hidden = false;
}

let mode = 'in';
function setMode(m){
  mode = m;
  $('modeIn').classList.toggle('active', m==='in');
  $('modeUp').classList.toggle('active', m==='up');
  $('nameField').hidden = (m==='in');
  $('authBtn').textContent = m==='in' ? 'Sign in' : 'Create account';
  $('passInput').autocomplete = m==='in' ? 'current-password' : 'new-password';
  showMsg('');
}

async function submitAuth(){
  const email = $('emailInput').value.trim();
  const password = $('passInput').value;
  const name = $('nameInput').value.trim();
  if(!email || !password){ showMsg('Please enter your email and password.', 'err'); return; }
  if(mode==='up' && !name){ showMsg('Please enter your name.', 'err'); return; }
  $('authBtn').disabled = true;
  showMsg('');
  try{
    if(mode==='in'){
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if(error){ showMsg(error.message, 'err'); }
      else { $('passInput').value = ''; await handleSession(data.session); }
    } else {
      const { data, error } = await sb.auth.signUp({ email, password, options:{ data:{ display_name: name } } });
      if(error){ showMsg(error.message, 'err'); }
      else if(data.session){ $('passInput').value = ''; await handleSession(data.session); }
      else { showMsg('Account created. Check your email to confirm it, then sign in.', 'ok'); setMode('in'); showMsg('Account created. Check your email to confirm it, then sign in.', 'ok'); }
    }
  }catch(e){
    showMsg('Something went wrong. Please try again.', 'err');
  }
  $('authBtn').disabled = false;
}

(async function init(){
  if(!window.supabase){
    $('loadingView').textContent = 'Could not load the sign-in service. Check your internet connection and refresh.';
    return;

  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const { data } = await sb.auth.getSession();
    await handleSession(data.session);
  }catch(e){ showAuth(); }
})();
